<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunshan Cultural Atlas · Demo</title><link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--ink:#1d302d;--teal:#116b63;--mint:#d4efe4;--cream:#fbf8ed;--coral:#df8066;--line:#d9e4d9}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans SC",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:3px}.shell{display:grid;grid-template-columns:285px minmax(350px,1fr) 310px;grid-template-rows:76px minmax(500px,1fr) auto;min-height:100vh;max-width:1800px;margin:auto;background:#fff}.top{grid-column:1/-1;background:#f4f6e9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 28px}.brand{font-family:Georgia,serif;font-size:28px;letter-spacing:-.04em}.brand span{color:var(--teal)}.top small{color:#536963}.side,.details{padding:24px;overflow:auto;background:#fafbf4}.side{border-right:1px solid var(--line)}.details{border-left:1px solid var(--line)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:800;color:#4b7770}h1,h2,h3,p{margin:0}h1{font:40px/1.08 Georgia,serif;margin:15px 0}h2{font:27px Georgia,serif;margin:6px 0 12px}h3{font-size:15px;margin:18px 0 8px}.muted{color:#60736d;font-size:13px}.intro{margin-bottom:24px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 20px}.chip,.secondary{border:1px solid #a9c9bd;background:white;color:var(--ink);border-radius:30px;padding:7px 12px}.chip[aria-pressed=true],.secondary.active{background:var(--teal);color:#fff;border-color:var(--teal)}.place{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0;display:flex;align-items:center;gap:10px}.place:hover,.place.current{border-color:var(--teal);box-shadow:0 2px 12px #0d60501c}.place b{display:block}.place small{display:block;color:#64786d}.dot{height:10px;width:10px;border-radius:50%;flex:none;background:var(--teal)}.dot.food{background:var(--coral)}.dot.culture{background:#ac869f}.map-area{position:relative;min-height:540px;background:#dfebe5}#map{height:100%;min-height:540px;z-index:1}.map-label{position:absolute;top:18px;left:18px;z-index:500;background:#fbfff1ee;padding:12px 15px;border:1px solid #cee1d3;border-radius:12px;box-shadow:0 4px 20px #28594a20;pointer-events:none}.map-label strong{display:block;font:22px Georgia,serif}.map-label small{font-size:11px;color:#506962}.pin{border:2px solid white;border-radius:50%;box-shadow:0 2px 12px #193d3880;background:var(--teal);width:22px;height:22px}.pin.food{background:var(--coral)}.pin.culture{background:#ac869f}.pin.selected{width:28px;height:28px;border:4px solid #fff}.leaflet-container{font:inherit}.detail-card{background:#e5f1e9;border-radius:18px;padding:18px;margin-top:14px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--teal)}.detail-card p{margin:10px 0}.notice{border-left:3px solid var(--coral);padding:8px 10px;margin:15px 0;background:#fff8ef;color:#695748;font-size:12px}.primary{border:0;border-radius:25px;padding:10px 16px;background:var(--teal);color:white;font-weight:700}.link{color:var(--teal)}.footer{grid-column:1/-1;background:#eff5e8;border-top:1px solid var(--line);padding:20px 26px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.route-controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.route-controls label{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}select{max-width:165px;padding:8px;border:1px solid #b8d0c2;border-radius:8px;background:white}.modes{display:flex;flex-wrap:wrap;gap:7px}.route-result{background:white;border:1px solid #d4e4d7;padding:14px;border-radius:13px}.stats{display:flex;gap:15px;flex-wrap:wrap;margin:8px 0}.stats strong{color:var(--teal)}.source{font-size:11px;color:#60736d}.error{padding:20px;color:#8b332b;background:#fff2ec}.empty{padding:20px;color:#596b65}@media(max-width:1050px){.shell{grid-template-columns:240px 1fr;grid-template-rows:70px minmax(480px,1fr) auto auto}.details{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.footer{grid-column:1/-1}}@media(max-width:670px){.shell{display:block}.top{padding:12px 16px}.brand{font-size:21px}.side,.details{padding:16px}.side{border-right:0}.place-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.map-area,#map{height:58vh;min-height:390px}.footer{display:block;padding:16px}.route-result{margin-top:15px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">KUNSHAN <span>·</span> cultural atlas</div><small>探索昆山 / Interactive prototype</small></header><aside class="side"><div class="eyebrow">Places · 地点</div><h1>循着文化<br>走过昆山。</h1><p class="muted intro">筛选地点、收藏线索，再比较不同目的下的示意路线。</p><h3>探索主题</h3><div class="filters" id="filters" role="group" aria-label="地点类别筛选"></div><h3 id="places-heading">地点</h3><div id="place-list" class="place-list"></div><h3>我的收藏 <span id="saved-count">0</span></h3><p id="saved-list" class="muted">点击地点后可以收藏。</p></aside><main class="map-area"><div class="map-label"><strong>Kunshan / 昆山</strong><small>文化、饮食与水乡 · 地点为小样本</small></div><div id="map" role="application" aria-label="昆山交互地图"></div><div id="map-error" role="alert"></div></main><aside class="details" aria-live="polite"><div class="eyebrow">Place story · 地点故事</div><div id="detail"></div></aside><section class="footer" aria-labelledby="route-title"><div><div class="eyebrow">01 / Compare routes</div><h2 id="route-title">选择一条文化路径</h2><p class="muted">选择起点、终点与目标。线条只连接示意节点，不代表真实道路。</p><div class="route-controls"><label>起点 <select id="start" aria-label="路线起点"></select></label><label>终点 <select id="end" aria-label="路线终点"></select></label></div><div class="modes" id="modes" role="group" aria-label="路线目标"></div><p class="source" style="margin-top:8px">演示路段与时间、文化分、步行负担均为团队假设；舒缓步行不代表已核实的无障碍路线。</p></div><div><div class="route-result" id="route-result" aria-live="polite"></div><button class="secondary" id="reset" style="margin-top:9px">重置选择</button></div></section></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async function(){const $=id=>document.getElementById(id), categories=[['all','全部'],['heritage','古镇·园林'],['culture','文化'],['food','饮食']],modes=[['fast','最快'],['culture','文化探索'],['gentle','舒缓步行']];let features=[],edges=[],map,markers=[],line,selected='jinxi',filter='all',mode='fast',saved=new Set();const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const feature=id=>features.find(f=>f.properties.id===id),name=id=>feature(id)?.properties.name||id;try{const res=await Promise.all(['data/places.geojson','data/routes.json'].map(x=>fetch(x)));if(res.some(x=>!x.ok))throw Error('数据文件加载失败');const [places,routes]=await Promise.all(res.map(x=>x.json()));features=places.features;edges=routes.edges;if(!window.L)throw Error('地图组件未能加载，请检查网络');map=L.map('map',{zoomControl:false}).setView([31.27,120.91],11);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).on('tileerror',()=>{if(!$('map-error').textContent)$('map-error').textContent='底图暂不可用；请检查网络。地点与路线仍可查看。'}).addTo(map);init()}catch(e){$('map-error').className='error';$('map-error').textContent='无法载入演示地图：'+e.message+'。请通过本地服务器运行，并检查网络连接。';$('detail').textContent='地点信息暂不可用。';$('route-result').textContent='路线数据暂不可用。'}function init(){const routeIds=[...new Set(edges.flatMap(e=>[e.a,e.b]))];for(const id of ['start','end'])$(id).innerHTML=routeIds.map(x=>`<option value="${safe(x)}">${safe(name(x))}</option>`).join('');$('start').value='tinglin';$('end').value='zhouzhuang';$('filters').innerHTML=categories.map(([id,label])=>`<button class="chip" data-filter="${id}" aria-pressed="${id==='all'}">${label}</button>`).join('');$('modes').innerHTML=modes.map(([id,label])=>`<button class="chip" data-mode="${id}" aria-pressed="${id===mode}">${label}</button>`).join('');$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;render()}};$('place-list').onclick=e=>{const b=e.target.closest('[data-id]');if(b)select(b.dataset.id)};$('detail').onclick=e=>{if(e.target.id==='save'){saved.has(selected)?saved.delete(selected):saved.add(selected);render()}};$('start').onchange=$('end').onchange=render;$('reset').onclick=()=>{selected='jinxi';filter='all';mode='fast';saved.clear();$('start').value='tinglin';$('end').value='zhouzhuang';map.setView([31.27,120.91],11);render()};render()}function select(id){selected=id;const p=feature(id);if(p)map.panTo([p.geometry.coordinates[1],p.geometry.coordinates[0]]);render()}function render(){document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===filter));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));const visible=features.filter(f=>filter==='all'||f.properties.type===filter);$('place-list').innerHTML=visible.map(f=>`<button class="place ${f.properties.id===selected?'current':''}" data-id="${safe(f.properties.id)}"><i class="dot ${safe(f.properties.type)}"></i><span><b>${safe(f.properties.name)}</b><small>${safe(f.properties.town)} · ${safe(f.properties.en)}</small></span></button>`).join('')||'<p class="empty">暂无此类地点</p>';$('saved-count').textContent=saved.size;$('saved-list').textContent=saved.size?[...saved].map(name).join(' · '):'点击地点后可以收藏。';markers.forEach(m=>map.removeLayer(m));markers=visible.map(f=>{let p=f.properties,c=f.geometry.coordinates;const icon=L.divIcon({html:`<div class="pin ${safe(p.type)} ${p.id===selected?'selected':''}"></div>`,className:'',iconSize:[28,28],iconAnchor:[14,14]});return L.marker([c[1],c[0]],{icon,title:p.name}).on('click',()=>select(p.id)).addTo(map)});const f=feature(selected);if(f){let p=f.properties;$('detail').innerHTML=`<h2>${safe(p.name)}</h2><p class="muted">${safe(p.en)} · ${safe(p.town)}</p><div class="detail-card"><span class="tag">${p.type==='food'?'Food':p.type==='culture'?'Culture':'Heritage'}</span><p>${safe(p.story)}</p><p class="source">数据状态：${safe(p.verified)}。坐标为近似展示位置。</p>${p.source?`<a class="link" href="${safe(p.source)}" target="_blank" rel="noopener noreferrer">查看景区来源 ↗</a>`:''}</div><div class="notice">地点位置仅供课程演示。开放时间、店铺位置及设施信息需另行核实。</div><button class="primary" id="save" aria-pressed="${saved.has(selected)}">${saved.has(selected)?'✓ 已收藏 · 点击移除':'＋ 收藏地点'}</button>`}route()}function route(){const start=$('start').value,end=$('end').value;if(start===end){$('route-result').innerHTML='<b>起点和终点相同</b><p class="muted">请选择不同地点。</p>';if(line){map.removeLayer(line);line=null}return}const nodes=new Set(edges.flatMap(e=>[e.a,e.b]));let dist=Object.fromEntries([...nodes].map(n=>[n,Infinity])),prev={},remaining=new Set(nodes);dist[start]=0;const weight=e=>mode==='fast'?e.minutes:mode==='culture'?e.minutes-3*e.culture:e.minutes+4*e.walking;while(remaining.size){let u=[...remaining].reduce((a,b)=>dist[a]<dist[b]?a:b);if(!Number.isFinite(dist[u])||u===end)break;remaining.delete(u);for(const e of edges.filter(e=>e.a===u||e.b===u)){const v=e.a===u?e.b:e.a,alt=dist[u]+weight(e);if(alt<dist[v]){dist[v]=alt;prev[v]={from:u,edge:e}}}}let path=[end],used=[];while(path[0]!==start&&prev[path[0]]){used.unshift(prev[path[0]].edge);path.unshift(prev[path[0]].from)}if(path[0]!==start){$('route-result').textContent='没有可用的演示路径。';return}const total=key=>used.reduce((n,e)=>n+e[key],0);$('route-result').innerHTML=`<span class="tag">${safe(modes.find(x=>x[0]===mode)[1])} · 演示计算</span><h3>${path.map(name).map(safe).join(' → ')}</h3><div class="stats"><span><strong>${total('minutes')} 分钟</strong> 假设用时</span><span><strong>${total('culture')}</strong> 文化分</span><span><strong>${total('walking')}</strong> 步行负担</span></div><p class="source">${mode==='fast'?'最小化假设用时':mode==='culture'?'最小化 用时 − 3 × 文化分':'最小化 用时 + 4 × 步行负担'}。折线不是道路导航。</p>`;if(line)map.removeLayer(line);line=L.polyline(path.map(id=>{const [lng,lat]=feature(id).geometry.coordinates;return[lat,lng]}),{color:mode==='culture'?'#d36d53':mode==='gentle'?'#735c91':'#167b6c',weight:5,opacity:.84,dashArray:'8 8'}).addTo(map)}})();
</script></body></html>
