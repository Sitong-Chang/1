<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunshan Cultural Atlas · V2</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--ink:#24403b;--green:#287665;--cream:#f9f7ef;--line:#dae3d7;--rose:#d18271}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.5 system-ui,'Noto Sans SC',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,'Noto Serif SC',serif;font-weight:500}h1{font-size:36px;line-height:1.18;margin:14px 0}h2{font-size:27px;margin:8px 0 13px}h3{font-size:15px}.muted,.hint{color:#688078}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--green)}.shell{display:grid;grid-template-columns:310px minmax(400px,1fr) 315px;grid-template-rows:72px minmax(520px,1fr) auto;max-width:1800px;min-height:100vh;margin:auto;background:white}.top{grid-column:1/-1;padding:0 25px;background:#203f3a;color:white;display:flex;justify-content:space-between;align-items:center}.brand{font:25px Georgia,serif}.brand em{color:#dda68b}.top small{color:#d0e0d8}.side,.detail{padding:24px;background:#fbfaf4;overflow:auto;max-height:calc(100vh - 72px)}.side{border-right:1px solid var(--line)}.detail{border-left:1px solid var(--line)}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:18px 0 10px}.filters,.tools,.modes,.actions{display:flex;gap:7px;flex-wrap:wrap}.chip,.ghost{border:1px solid #aecbbb;border-radius:22px;padding:8px 12px;background:white;color:var(--ink)}.chip[aria-pressed=true],.chip:hover{background:var(--green);color:white}.tools{margin:17px 0}.tools button{flex:1}.item-list{display:grid;gap:8px;margin-top:12px}.item{display:flex;width:100%;gap:11px;align-items:center;text-align:left;padding:11px;border:1px solid var(--line);border-radius:13px;background:white;cursor:grab}.item:hover,.item.active{border-color:var(--green);box-shadow:0 4px 17px #256e6125}.item b,.item small{display:block}.item small{color:#72817b}.number{display:grid;place-items:center;flex:none;width:30px;height:30px;background:#e0ede5;border-radius:50%;color:var(--green);font:15px Georgia,serif}.food .number{background:#f9e5de;color:#a55d4f}.culture .number{background:#eee5ef;color:#88618b}.map-wrap{position:relative;min-height:520px;background:#e0ece6}.map-wrap.drag{outline:5px solid var(--rose);outline-offset:-5px}#map{height:100%;min-height:520px}.map-label,.map-hint{position:absolute;z-index:500;pointer-events:none;background:#fffcf1ec;border:1px solid var(--line);box-shadow:0 5px 20px #224f3d26;border-radius:12px;padding:11px 15px}.map-label{top:17px;left:17px}.map-label strong{display:block;font:23px Georgia,serif}.map-hint{bottom:15px;left:15px;color:var(--green)}.pin{width:24px;height:24px;border:3px solid white;border-radius:50%;background:var(--green);box-shadow:0 2px 11px #18483c9a}.pin.food{background:var(--rose)}.pin.culture{background:#9b7c9e}.pin.selected{width:30px;height:30px;border-width:5px}.story{padding:18px;background:#e7f0e8;border-radius:17px;margin:17px 0}.story p{margin:11px 0}.notice{background:#fff2e9;border-left:3px solid var(--rose);padding:12px;margin:17px 0;font-size:12px}.primary{border:0;background:var(--green);color:white;border-radius:22px;padding:10px 15px}.primary:disabled{opacity:.5;cursor:not-allowed}.source{font-size:11px;color:#698079}.source a{color:var(--green)}.footer{grid-column:1/-1;border-top:1px solid var(--line);background:#edf3ea;padding:22px 26px;display:grid;grid-template-columns:250px minmax(300px,1fr) 290px;gap:24px}.stops{display:flex;gap:7px;flex-wrap:wrap;min-height:35px;margin:10px 0}.stop{border:1px solid #cbdccc;background:white;border-radius:20px;padding:6px 9px}.stop button{border:0;background:transparent;color:#9b5648;font-weight:bold}.result{background:white;border:1px solid var(--line);border-radius:13px;padding:14px;min-height:110px}.result p{margin:7px 0}.stats{display:flex;gap:11px;flex-wrap:wrap}.stats strong{color:var(--green)}.empty{padding:12px 0;color:#698079}.error{position:absolute;z-index:800;bottom:55px;left:15px;background:#fff0e8;padding:10px;color:#9b4239}.leaflet-container{font:inherit}@media(max-width:1050px){.shell{grid-template-columns:260px 1fr}.detail{grid-column:1/-1;max-height:none;border-top:1px solid var(--line)}.footer{grid-template-columns:1fr 2fr}}@media(max-width:700px){.shell{display:block}.top{height:66px;padding:0 15px}.brand{font-size:19px}.top small{font-size:10px}.side,.detail{padding:18px;max-height:none}.item-list{grid-template-columns:repeat(2,minmax(0,1fr))}.item{cursor:pointer}#map,.map-wrap{height:55vh;min-height:380px}.footer{display:block;padding:18px}.result{margin-top:16px}}</style></head><body><div class="shell"><header class="top"><div class="brand">KUNSHAN <em>✳</em> CULTURAL ATLAS</div><small>在水乡之间，找到自己的路径 · DEMO 02</small></header><aside class="side"><div class="eyebrow">01 / Discover</div><h1>循着文化<br>走过昆山。</h1><p class="muted">拖动地点到地图，或直接点击放大查看。</p><input id="search" class="search" type="search" placeholder="搜索地点或区域" aria-label="搜索地点"><div class="filters" id="filters"></div><div class="tools"><button id="all" class="ghost">＋ 加入全部景点</button><button id="random" class="ghost">✦ 随机路线</button></div><h3>探索地点 <small id="count" class="hint"></small></h3><div id="list" class="item-list"></div></aside><main id="dropzone" class="map-wrap"><div class="map-label"><strong>Kunshan / 昆山</strong><small>文化地图 · 课程原型</small></div><div id="map" role="application" aria-label="昆山文化地点地图"></div><div class="map-hint">↗ 将地点拖进地图，或直接点击</div><div id="error" role="alert"></div></main><aside class="detail"><div class="eyebrow">02 / Place story</div><div id="detail" aria-live="polite"></div></aside><section class="footer"><div><div class="eyebrow">03 / Your journey</div><h2>我的文化路线</h2><p class="muted">每加入一个地点自动重算；第一个加入的地点是起点。</p><button id="clear" class="ghost" style="margin-top:12px">清空路线</button></div><div><h3>已选地点 <span id="stop-count">0</span></h3><div id="stops" class="stops" aria-live="polite"></div><div id="modes" class="modes"></div><p class="source" style="margin-top:9px">连线仅为示意；用时、文化分、步行负担都是假设值。“舒缓步行”未经无障碍核实。</p></div><div class="result" id="result" aria-live="polite"></div></section></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let places=[],edges=[],map,markers=[],line,selected='jinxi',stops=[],mode='fast',filter='all',search='';const bounds=L.latLngBounds([31.07,120.72],[31.52,121.12]),types={all:'全部',heritage:'古镇·园林',culture:'文化',food:'饮食'},modes={fast:'最快',culture:'文化探索',gentle:'舒缓步行'},get=id=>places.find(p=>p.properties.id===id),name=id=>get(id)?.properties.name||id,coord=id=>{let [lng,lat]=get(id).geometry.coordinates;return[lat,lng]};try{const [p,r]=await Promise.all(['data/places.geojson','data/routes.json'].map(url=>fetch(url).then(res=>{if(!res.ok)throw Error('数据文件读取失败');return res.json()})));places=p.features;edges=r.edges;map=L.map('map',{maxBounds:bounds,maxBoundsViscosity:1,minZoom:10,zoomControl:false}).fitBounds(bounds);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{bounds,maxZoom:17,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).on('tileerror',()=>{$('error').className='error';$('error').textContent='底图不可用，请检查网络。'}).addTo(map);bind();render()}catch(e){$('error').className='error';$('error').textContent='加载失败：'+e.message+'。请使用本地服务器打开。'}function bind(){$('filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;renderList()}};$('search').oninput=e=>{search=e.target.value.trim().toLowerCase();renderList()};$('list').onclick=e=>{let b=e.target.closest('[data-id]');if(b)select(b.dataset.id)};$('list').ondragstart=e=>{let b=e.target.closest('[data-id]');if(b){e.dataTransfer.setData('text/plain',b.dataset.id);e.dataTransfer.effectAllowed='copy'}};const z=$('dropzone');z.ondragover=e=>{e.preventDefault();z.classList.add('drag')};z.ondragleave=e=>{if(!z.contains(e.relatedTarget))z.classList.remove('drag')};z.ondrop=e=>{e.preventDefault();z.classList.remove('drag');let id=e.dataTransfer.getData('text/plain');if(get(id))select(id)};$('detail').onclick=e=>{if(e.target.closest('#add'))add(selected);if(e.target.closest('#cancel')){selected=null;render()}};$('all').onclick=()=>{stops=places.map(p=>p.properties.id);selected=stops[0];render();fit()};$('random').onclick=()=>{let ids=places.map(p=>p.properties.id);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}stops=ids.slice(0,3+Math.floor(Math.random()*3));selected=stops[0];render();fit()};$('clear').onclick=()=>{stops=[];render();map.fitBounds(bounds)};$('stops').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){stops=stops.filter(id=>id!==b.dataset.remove);render()}};$('modes').onclick=e=>{let b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;renderRoute()}}}function select(id){selected=id;render();map.flyTo(coord(id),14,{duration:.8})}function add(id){if(id&&!stops.includes(id)){stops.push(id);render();fit()}}function fit(){if(stops.length>1)map.fitBounds(L.latLngBounds(stops.map(coord)).pad(.18),{maxZoom:13})}function render(){renderList();renderMap();renderDetail();renderRoute()}function renderList(){$('filters').innerHTML=Object.entries(types).map(([k,v])=>`<button class="chip" data-filter="${k}" aria-pressed="${filter===k}">${v}</button>`).join('');let items=places.filter(p=>(filter==='all'||p.properties.type===filter)&&(`${p.properties.name} ${p.properties.town} ${p.properties.en}`.toLowerCase().includes(search)));$('count').textContent=`${items.length} 处`;$('list').innerHTML=items.map((p,i)=>{let x=p.properties;return `<button draggable="true" class="item ${esc(x.type)} ${x.id===selected?'active':''}" data-id="${esc(x.id)}" aria-label="查看${esc(x.name)}，可拖到地图"><span class="number">${String(i+1).padStart(2,'0')}</span><span><b>${esc(x.name)}</b><small>${esc(x.town)} · ${esc(x.en)}</small></span></button>`}).join('')||'<p class="empty">没有匹配地点。</p>'}function renderMap(){markers.forEach(m=>map.removeLayer(m));markers=places.map(p=>{let x=p.properties;return L.marker(coord(x.id),{title:x.name,icon:L.divIcon({html:`<div class="pin ${esc(x.type)} ${x.id===selected?'selected':''}"></div>`,className:'',iconSize:[31,31],iconAnchor:[15,15]})}).on('click',()=>select(x.id)).addTo(map)})}function renderDetail(){let p=get(selected);if(!p){$('detail').innerHTML='<p class="empty">从左侧选择地点，阅读介绍后加入路线。</p>';return}let x=p.properties,added=stops.includes(x.id);$('detail').innerHTML=`<h2>${esc(x.name)}</h2><p class="muted">${esc(x.en)} · ${esc(x.town)}</p><div class="story"><span class="eyebrow">${esc(types[x.type])} / ${esc(x.town)}</span><p>${esc(x.story)}</p><p class="source">数据状态：${esc(x.verified)}；坐标为近似展示位置。</p>${x.source?`<p class="source"><a href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">查看名称来源 ↗</a></p>`:''}</div><div class="notice">开放时间、具体设施与通行条件待核实；示意点不是具体商家或场馆。</div><div class="actions"><button class="primary" id="add" ${added?'disabled':''}>${added?'✓ 已加入路线':'＋ 加入路线'}</button><button class="ghost" id="cancel">取消选择</button></div>`}function shortest(a,b){if(a===b)return{cost:0,nodes:[a],links:[]};let dist={[a]:0},prev={},pending=new Set(places.map(p=>p.properties.id)),weight=e=>mode==='fast'?e.minutes:mode==='gentle'?e.minutes+6*e.walking:e.minutes/(1+e.culture);while(pending.size){let u=[...pending].reduce((v,w)=>(dist[v]??Infinity)<=(dist[w]??Infinity)?v:w);if(!Number.isFinite(dist[u]??Infinity))break;pending.delete(u);if(u===b)break;for(let edge of edges){if(edge.a!==u&&edge.b!==u)continue;let v=edge.a===u?edge.b:edge.a,alt=dist[u]+weight(edge);if(pending.has(v)&&alt<(dist[v]??Infinity)){dist[v]=alt;prev[v]={u,edge}}}}if(!Number.isFinite(dist[b]??Infinity))return null;let nodes=[b],links=[];while(nodes[0]!==a){let q=prev[nodes[0]];if(!q)return null;links.unshift(q.edge);nodes.unshift(q.u)}return{cost:dist[b],nodes,links}}function optimal(){if(stops.length<2)return null;let cache=new Map();for(let a of stops)for(let b of stops)if(a!==b)cache.set(a+'|'+b,shortest(a,b));let best=null;function walk(order,left,cost){if(best&&cost>=best.cost)return;if(!left.length){best={order:[...order],cost};return}for(let id of left){let leg=cache.get(order.at(-1)+'|'+id);if(leg)walk([...order,id],left.filter(x=>x!==id),cost+leg.cost)}}walk([stops[0]],stops.slice(1),0);if(!best)return null;let nodes=[best.order[0]],links=[];for(let i=1;i<best.order.length;i++){let leg=cache.get(best.order[i-1]+'|'+best.order[i]);nodes.push(...leg.nodes.slice(1));links.push(...leg.links)}return{...best,nodes,links}}function renderRoute(){$('stop-count').textContent=stops.length;$('stops').innerHTML=stops.length?stops.map((id,i)=>`<span class="stop">${i===0?'起点 · ':''}${esc(name(id))}<button data-remove="${esc(id)}" aria-label="移除${esc(name(id))}">×</button></span>`).join(''):'<span class="empty">还没有地点。请从右侧介绍加入路线。</span>';$('modes').innerHTML=Object.entries(modes).map(([k,v])=>`<button class="chip" data-mode="${k}" aria-pressed="${mode===k}">${v}</button>`).join('');if(line){map.removeLayer(line);line=null}if(stops.length<2){$('result').innerHTML='<h3>等待下一站</h3><p class="muted">至少加入两个地点，自动生成示意路线。</p>';return}let r=optimal();if(!r){$('result').textContent='所选地点之间没有演示连接。';return}let sum=k=>r.links.reduce((n,e)=>n+e[k],0);$('result').innerHTML=`<span class="eyebrow">${modes[mode]} / 演示计算</span><p>${r.order.map(name).map(esc).join(' → ')}</p><div class="stats"><span><strong>${sum('minutes')} 分钟</strong> 假设用时</span><span>文化分 <strong>${sum('culture')}</strong></span><span>步行负担 <strong>${sum('walking')}</strong></span></div><p class="source">固定首个加入地点，优化其余地点顺序；途中可能经过连接节点。${mode==='culture'?'权重＝时间÷(1＋文化分)':mode==='gentle'?'权重＝时间＋6×步行负担':'权重＝时间'}。虚线不沿真实道路。</p>`;line=L.polyline(r.nodes.map(coord),{color:mode==='culture'?'#c46c57':mode==='gentle'?'#8b719a':'#177a69',weight:5,opacity:.9,dashArray:'9 8'}).addTo(map)}})();
</script></body></html>
